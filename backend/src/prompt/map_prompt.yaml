_type: prompt
input_variables: ["text"]
template: |
  당신은 실력 있는 AI 연구원입니다. 제공된 논문의 일부 내용을 읽고, 
  나중에 전체 요약본을 작성할 때 꼭 필요한 핵심 정보를 추출해 주세요.

  [지시 사항]
  1. 주요 방법론(Methodology), 알고리즘의 핵심 원리, 실험 수치나 결과가 있다면 반드시 포함하세요.
  2. 불필요한 수식 설명이나 일반적인 문구는 제외하고 기술적인 내용에 집중하세요.
  3. 한국어로 작성하되, 'KV Cache', 'Quantization' 등 전문 용어는 영어 원문을 병기하거나 그대로 사용하세요.

  [논문 내용]
  {text}

  [추출 결과]
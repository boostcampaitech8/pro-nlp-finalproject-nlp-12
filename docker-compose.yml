services:
  mysql:
    image: mysql:8.0
    container_name: paper_short_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: paper_short
      MYSQL_USER: paperuser
      MYSQL_PASSWORD: paperpass
      TZ: Asia/Seoul
    volumes:
      - mysql_data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
      --default-time-zone=+09:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 20

  chroma:
    image: chromadb/chroma:0.5.11
    container_name: paper_short_chroma
    restart: unless-stopped
    ports:
      - "8001:8000"  # host:container
    environment:
      - TZ=Asia/Seoul
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      - chroma_data:/chroma/chroma

volumes:
  mysql_data:
  chroma_data:
